name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@4.0.0
      - name: Compile
        run: arduino-cli compile -b esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB,CDCOnBoot=cdc --output-dir build firmware/mini_pet
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: build/mini_pet.ino.bin

  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render preview
        run: |
          c++ -std=c++17 -O2 -Wall tools/preview.cpp -o preview
          ./preview | python3 tools/apng.py sheet.png
      - uses: actions/upload-artifact@v4
        with:
          name: preview
          path: sheet.png
